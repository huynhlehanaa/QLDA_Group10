<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KPI Portal - CEO & Manager</title>
  <link rel="stylesheet" href="/portal/styles.css" />
</head>
<body>
  <main class="container">
    <h1>KPI Portal - CEO & Manager</h1>

    <section id="auth-card" class="card">
      <h2>Đăng nhập</h2>
      <form id="login-form">
        <label>Email <input type="email" id="email" required /></label>
        <label>Mật khẩu <input type="password" id="password" required /></label>
        <button type="submit">Đăng nhập</button>
      </form>
      <p class="hint">Mật khẩu lưu trong phiên trình duyệt để tăng bảo mật.</p>
    </section>

    <section id="app-card" class="card hidden">
      <div class="row between">
        <h2>Xin chào <span id="me-name"></span></h2>
        <button id="logout-btn" type="button">Đăng xuất</button>
      </div>
      <p>Vai trò: <strong id="me-role"></strong></p>
      <p>Email: <strong id="me-email"></strong></p>

      <details>
        <summary>Đổi mật khẩu</summary>
        <form id="change-password-form" class="inline-form">
          <input type="password" id="old-password" placeholder="Mật khẩu cũ" required />
          <input type="password" id="new-password" placeholder="Mật khẩu mới" required />
          <button type="submit">Đổi mật khẩu</button>
        </form>
      </details>
    </section>

    <section id="ceo-panel" class="card hidden">
      <h2>CEO - Quản lý tài khoản Manager</h2>
      <form id="create-manager-form" class="inline-form">
        <input id="manager-name" placeholder="Họ tên" required />
        <input id="manager-email" type="email" placeholder="Email" required />
        <input id="manager-dept-id" placeholder="Department ID" required />
        <button type="submit">Tạo Manager</button>
      </form>
      <div class="row gap">
        <button id="refresh-managers-btn" type="button">Tải danh sách Manager</button>
      </div>
      <div id="managers-table"></div>

      <h3>Quản lý tổ chức</h3>
      <form id="create-department-form" class="inline-form">
        <input id="dept-name" placeholder="Tên phòng ban" required />
        <input id="dept-desc" placeholder="Mô tả" />
        <input id="dept-manager-id" placeholder="Manager ID (tuỳ chọn)" />
        <button type="submit">Tạo phòng ban</button>
      </form>
      <div class="row gap">
        <button id="refresh-departments-btn" type="button">Tải danh sách phòng ban</button>
      </div>
      <div id="departments-table"></div>
    </section>

    <section id="manager-panel" class="card hidden">
      <h2>Manager - Quản lý tài khoản Staff</h2>
      <form id="create-staff-form" class="inline-form">
        <input id="staff-name" placeholder="Họ tên" required />
        <input id="staff-email" type="email" placeholder="Email" required />
        <input id="staff-phone" placeholder="Số điện thoại" />
        <button type="submit">Tạo Staff</button>
      </form>
      <div class="row gap">
        <button id="refresh-staff-btn" type="button">Tải danh sách Staff</button>
      </div>
      <div id="staff-table"></div>
    </section>

    <p id="message" role="status"></p>
  </main>

  <script src="/portal/app.js"></script>
</body>
</html>
